name: Test Erixcel React Hooks

on:
  pull_request:
    paths:
      - "plugins/react-standards/**"
      - ".github/workflows/test-react-validators.yml"
  push:
    branches: [main]
    paths:
      - "plugins/react-standards/**"
      - ".github/workflows/test-react-validators.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install TypeScript AST parser
        run: npm install --prefix plugins/react-standards --no-save typescript@~6.0.2
      - name: Compile hook scripts
        run: python3 -m compileall -q plugins/react-standards/hooks
      - name: Execute React lifecycle tests
        run: python3 -m unittest discover -s plugins/react-standards/tests -p "test_*.py" -v
